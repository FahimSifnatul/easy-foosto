<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foosto Lunch — আজকের ঘরোয়া রান্না</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://menu.foosto.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3E9D2; --bg-soft:#EADFC4; --surface:#FFFCF5;
  --ink:#2B1D12; --ink-soft:#7A6650; --ink-faint:#A8977E;
  --brand-dark:#3B2B20;
  --gold:#B87F17; --gold-bg:#F0DDA9;
  --green:#52684A; --green-bg:#DCE4CF;
  --brick:#A2402F; --brick-bg:#F1D6CC;
  --border:#DDCBA6; --focus:#7A4E12;
  --shadow:0 1px 2px rgba(43,29,18,.10);
  --radius-m:12px; --maxw:940px; --barH:0px;
  --display:'Baloo Da 2','Hind Siliguri',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1C140D; --bg-soft:#241A11; --surface:#2A1F15;
    --ink:#F3E9D2; --ink-soft:#C9B896; --ink-faint:#8B7A62;
    --brand-dark:#120C08;
    --gold:#E3AF3F; --gold-bg:#3E2F14;
    --green:#90AB80; --green-bg:#26301F;
    --brick:#E0806A; --brick-bg:#3B1F19;
    --border:#3A2C1C; --focus:#E3AF3F;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Hind Siliguri','Inter',system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
::selection{background:var(--gold-bg);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:1px;border-radius:4px}
.app{max-width:var(--maxw);margin:0 auto;padding:0 18px 90px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Masthead: scrolls away with the page ---------- */
.masthead{background:var(--brand-dark);color:#F3E9D2;
  padding-top:max(12px,env(safe-area-inset-top))}
.masthead-inner{max-width:var(--maxw);margin:0 auto;padding:0 18px 11px;
  display:flex;flex-wrap:wrap;gap:9px 20px;align-items:center;justify-content:space-between}
.brand-row{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;flex:none;color:#E3AF3F}
.brand-name{font-family:var(--display);font-size:1.2rem;font-weight:700;letter-spacing:.2px;line-height:1.2}
.brand-tagline{font-size:.76rem;color:#D8C6A3;margin-top:0}

.meta-row{display:flex;flex-wrap:wrap;gap:6px 15px;align-items:center;
  font-size:.78rem;color:#E7D9BA}
.meta-item{display:flex;align-items:center;gap:6px}
.meta-item svg{width:14px;height:14px;flex:none;color:#E3AF3F}
.meta-item strong{color:#FBF3DE;font-weight:600}

/* ---------- Controls: the only thing that follows you down ---------- */
.controls{background:var(--brand-dark);color:#F3E9D2}
.controls-inner{max-width:var(--maxw);margin:0 auto;padding:0 18px 10px}
.controls.docked{position:fixed;top:0;left:0;right:0;z-index:30;
  box-shadow:0 6px 18px rgba(0,0,0,.22);padding-top:max(8px,env(safe-area-inset-top))}
.controls.docked .controls-inner{padding-bottom:8px}
.controls.docked .search-input{padding-top:7px;padding-bottom:7px}
.controls.docked .tool-btn{padding-top:0;padding-bottom:0;height:34px}
.controls.docked .fbar{margin-top:6px}
.dock-spacer{height:0}

.search-row{padding-top:9px;display:flex;gap:8px}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:#B7A481;pointer-events:none}
.search-input{width:100%;padding:9px 14px 9px 36px;border-radius:var(--radius-m);
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);
  color:#FBF3DE;font:inherit;font-size:.95rem}
.search-input::placeholder{color:#B7A481}
.search-input:focus-visible{outline:2.5px solid #E3AF3F;outline-offset:1px}
.tool-btn{flex:none;height:38px;padding:0 14px;border-radius:var(--radius-m);
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);
  color:#F3E9D2;font-size:.87rem;font-weight:600}
.tool-btn:hover{background:rgba(255,255,255,.15)}
.tool-btn[aria-expanded=true]{background:#E3AF3F;color:#2A1B06;border-color:#E3AF3F}

/* Two columns on phones so Sort and View share a row, with Price and both chip
   rails spanning the full width beneath them. The rail and price labels sit
   inline rather than on their own line: five stacked label lines was most of
   what made this panel tall enough to swallow a phone screen once pinned. */
.panel{margin-top:8px;padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;align-items:center}
/* `hidden` must win at every width. Do NOT re-declare .panel[hidden] in a
   media query — that is what made the toggle look dead on desktop. */
.panel[hidden]{display:none}
.panel .rail-field,.panel .price-field{grid-column:1/-1}
/* Last resort: however many chefs the rail holds, a pinned bar must never own
   more of the screen than the results it is filtering. */
.controls.docked .panel{max-height:40vh;overflow-y:auto}
@media(min-width:700px){
  .panel{grid-template-columns:minmax(130px,1fr) auto minmax(190px,1.2fr);gap:8px 14px}
  .panel .price-field{grid-column:auto}
}
.field > span{display:block;font-size:.71rem;color:#C6B392;margin-bottom:3px;letter-spacing:.01em}
.field > span b{color:#E3AF3F;font-weight:600}
.field select{width:100%;height:30px;border-radius:8px;font:inherit;font-size:.83rem;
  background:#2A1F15;color:#F3E9D2;border:1px solid rgba(255,255,255,.16);padding:0 7px}
.rail-field,.price-field{display:flex;align-items:center;gap:9px;min-width:0}
.rail-field > span,.price-field > span{flex:none;margin-bottom:0;white-space:nowrap}
.rail-field .chip-rail,.price-field .slider{flex:1;min-width:0}
.slider{position:relative;height:30px;display:flex;align-items:center}
.slider .track{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.18);border-radius:2px}
.slider .fill{position:absolute;height:3px;background:#E3AF3F;border-radius:2px}
.slider input{position:absolute;left:0;width:100%;margin:0;background:none;pointer-events:none;
  -webkit-appearance:none;appearance:none;height:32px}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;
  border-radius:50%;background:#F3E9D2;border:2px solid #E3AF3F;cursor:grab}
.slider input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;
  background:#F3E9D2;border:2px solid #E3AF3F;cursor:grab}
.slider input::-moz-range-track{background:none}
.group-toggle{height:30px;padding:0 12px;border-radius:999px;font-size:.78rem;font-weight:600;
  background:rgba(255,255,255,.07);color:#E7D9BA;border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.group-toggle[aria-pressed=true]{background:#E3AF3F;color:#2A1B06;border-color:#E3AF3F}

/* Chef rail doubles as the chef multi-select: tap to filter, tap again to drop. */
.chip-rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip-rail::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;font-size:.79rem;font-weight:600;
  background:rgba(255,255,255,.07);color:#E7D9BA;border:1px solid rgba(255,255,255,.12);
  white-space:nowrap;transition:background .15s ease,color .15s ease}
.chip:hover{background:rgba(255,255,255,.14)}
.chip[aria-pressed=true]{background:#E3AF3F;color:#2A1B06;border-color:#E3AF3F}
.chip .n{opacity:.65;font-weight:500;margin-left:5px}
/* An ingredient nobody is cooking today stays visible but inert: "গরু 0" is
   itself the answer to "is there beef today?", which hiding the chip isn't. */
.chip:disabled{opacity:.38;cursor:not-allowed}
.chip:disabled:hover{background:rgba(255,255,255,.07)}
.tag-chip{font-family:var(--display);font-size:.86rem}

.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:7px;
  font-size:.79rem;color:#D8C6A3}
.fchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 5px 0 10px;
  border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  font-size:.78rem;max-width:210px}
.fchip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{border:0;background:none;padding:0 4px;line-height:1;color:#C6B392;font-size:15px}
.fchip button:hover{color:#E3AF3F}
.clear-all{background:none;border:0;padding:0;color:#E3AF3F;font-size:.82rem;font-weight:600;
  text-decoration:underline;text-underline-offset:3px}
.clear-all[hidden]{display:none}

/* ---------- Hero ---------- */
.hero{padding:26px 0 20px}
.hero h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:700;color:var(--ink);max-width:19ch}
.hero p{margin:10px 0 0;color:var(--ink-soft);font-size:1rem;max-width:56ch}
.hero-stats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.hero-stat b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--gold);line-height:1.3}
.hero-stat span{font-size:.8rem;color:var(--ink-soft)}

/* ---------- Chef tiers ---------- */
/* No content-visibility here, deliberately. With `contain-intrinsic-size:0 460px`
   every off-screen chef block claimed 460px whether or not it needed it, so a
   filtered list of six dishes still reserved thousands of phantom pixels. As
   you scrolled, each block rendered, collapsed to its real height, and the page
   shrank under your thumb -- which is exactly why dishes seemed to vanish
   mid-scroll. At 19 dishes it bought nothing. If this list ever grows into the
   hundreds, bring it back as `contain-intrinsic-size:auto 460px` so each block
   remembers its measured height instead of guessing the same number for all. */
.tier{margin-top:8px;scroll-margin-top:calc(var(--barH, 0px) + 14px)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:14px 0 10px 14px;margin-top:22px;border-left:4px solid var(--gold)}
.ghead h2{font-size:1.22rem;font-weight:600;color:var(--ink)}
.gmeta{font-size:.8rem;color:var(--ink-faint);white-space:nowrap}

/* ---------- Dishes ---------- */
.item{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;
  padding:14px 4px;border-bottom:1px solid var(--border)}
.tier .item:last-child{border-bottom:none}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;
  background:var(--bg-soft);position:relative;border:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.none::after{content:"";position:absolute;inset:50% auto auto 50%;width:20px;height:20px;
  transform:translate(-50%,-50%);border:2px solid var(--ink-faint);border-radius:50%;opacity:.4}
.dish-info{min-width:0;flex:1}
.name{font-size:1.01rem;font-weight:500;color:var(--ink);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:7px;font-size:.82rem;
  color:var(--ink-soft);align-items:center}
/* Price gets its own line directly under the dish name rather than sharing the
   small meta row, where it read as one more grey chip among four. */
.price-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  margin-top:8px;font-size:.82rem}
.price{font-family:var(--display);font-size:1.18rem;font-weight:700;line-height:1.25;
  color:var(--gold);background:var(--gold-bg);border:1px solid var(--border);
  padding:1px 11px;border-radius:8px;font-variant-numeric:tabular-nums}
.chef-tag{font-weight:600;color:var(--ink-soft)}
/* The order hand-off drops you on Foosto's form with an empty menu-code field,
   so this number is the one thing you have to carry across. It looks like a
   button because it is one: tap to copy. */
.code-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;
  font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em;
  background:var(--bg-soft);border:1px solid var(--border);border-radius:7px;color:var(--ink);
  transition:border-color .12s ease,color .12s ease,background .12s ease}
.code-tag .ct-label{font-size:.78rem;font-weight:500;color:var(--ink-soft)}
.code-tag svg{width:13px;height:13px;flex:none;color:var(--ink-faint)}
.code-tag:hover{border-color:var(--gold);color:var(--gold)}
.code-tag:hover .ct-label,.code-tag:hover svg{color:var(--gold)}
.code-tag:active{transform:scale(.97)}
.code-tag.copied{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.code-tag.copied .ct-label,.code-tag.copied svg{color:var(--green)}
.code-tag.failed{background:var(--brick-bg);border-color:var(--brick);color:var(--brick)}
.code-tag.failed .ct-label,.code-tag.failed svg{color:var(--brick)}
.tag{padding:1px 8px;border-radius:999px;font-weight:600}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.low{background:var(--brick-bg);color:var(--brick)}
.tag.sold{background:var(--brick-bg);color:var(--brick)}
/* Available dishes render this as an <a> so the link can be middle-clicked,
   long-pressed or copied; sold-out ones stay a disabled <button>. */
.order{flex:none;align-self:center;display:inline-flex;align-items:center;justify-content:center;
  background:var(--gold);color:#2A1B06;border:none;text-decoration:none;
  border-radius:999px;padding:9px 18px;font-size:.9rem;font-weight:700;
  font-family:inherit;line-height:1.4;white-space:nowrap;cursor:pointer;
  transition:transform .12s ease,filter .12s ease}
.order:hover{filter:brightness(1.06)}
.order:active{transform:scale(.97)}
.order:disabled{background:none;color:var(--ink-faint);border:1px solid var(--border);
  cursor:not-allowed;filter:none;transform:none}
.item.out .name,.item.out .price,.item.out .thumb{opacity:.5}
@media(max-width:520px){
  .item{flex-wrap:wrap}
  .order{width:100%;align-self:stretch;margin-top:4px}
}

.skel{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border)}
.skel i{display:block;width:64px;height:64px;border-radius:10px;background:var(--bg-soft);flex:none}
.skel u{display:block;height:13px;border-radius:5px;background:var(--bg-soft);
  width:min(70%,420px);text-decoration:none}
.skel u + u{width:140px;margin-top:11px;height:11px}
@media(prefers-reduced-motion:no-preference){
  .skel i,.skel u{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
}
.empty-state{margin-top:40px;padding:34px 18px;text-align:center;color:var(--ink-soft);
  border:1px dashed var(--border);border-radius:var(--radius-m)}
.empty-state h3{font-size:1.1rem;color:var(--ink);margin-bottom:6px}
.empty-state button{margin-top:14px;background:none;border:1px solid var(--border);color:var(--ink);
  padding:8px 16px;border-radius:999px;font-size:.85rem}
footer.note{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);
  font-size:.8rem;color:var(--ink-faint);line-height:1.7}

.top-fab{position:fixed;right:18px;bottom:18px;z-index:20;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transition:opacity .2s ease}
.top-fab.show{opacity:1;pointer-events:auto}
.top-fab svg{width:18px;height:18px}

</style>
</head>
<body>

<!-- Ordering is a straight hand-off: the Order button links out to Foosto's own
     create-order page. Nothing is collected or POSTed from here, which is what
     lets this stay a static page with no proxy in front of it. -->

<svg style="display:none" aria-hidden="true">
  <symbol id="ic-tiffin" viewBox="0 0 48 48">
    <path d="M12 8c0-1.7 5.4-3 12-3s12 1.3 12 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="9" y="8" width="30" height="7" rx="2" fill="currentColor" opacity=".9"/>
    <rect x="10.5" y="16.5" width="27" height="9.5" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <rect x="10.5" y="27" width="27" height="9.5" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <rect x="9" y="37.5" width="30" height="4.5" rx="2" fill="currentColor" opacity=".9"/>
  </symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4.6-4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="ic-up" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M15.5 5.5A2 2 0 0 0 13.5 4H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 1.5 1.9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="masthead" role="banner">
  <div class="masthead-inner">
    <div class="brand-row">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-tiffin"/></svg>
      <div>
        <div class="brand-name">Foosto Lunch</div>
        <div class="brand-tagline">ঘরের রান্না, আপনার ডেস্কে</div>
      </div>
    </div>

    <div class="meta-row">
      <span class="meta-item" id="freshItem" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-refresh"/></svg>
        Menu Last Refreshed at <strong id="freshness"></strong>
      </span>
    </div>
  </div>
</header>

<!-- Sits in normal flow at rest; pins itself to the top once you scroll past
     it, so the search stays reachable without a tall header following you. -->
<div class="controls" id="controls">
  <div class="controls-inner">
    <div class="search-row">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-search"/></svg>
        <input id="q" class="search-input" type="search" autocomplete="off"
               placeholder="Search dishes, chefs or menu codes"
               aria-label="Search dishes, chefs or menu codes">
      </div>
      <button class="tool-btn" id="toggleFilters" aria-expanded="false" aria-controls="panel">Filters</button>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="field">
        <span id="lblSort">Sort</span>
        <select id="sort" aria-labelledby="lblSort">
          <option value="price-asc">Cheapest first</option>
          <option value="price-desc">Most expensive first</option>
          <option value="avail-desc">Most portions left</option>
          <option value="chef-asc">Chef name, A to Z</option>
        </select>
      </div>
      <div class="field">
        <span>View</span>
        <button class="group-toggle" id="groupBtn" aria-pressed="true">Grouped by chef</button>
      </div>
      <div class="field price-field">
        <span>Price <b id="priceLabel"></b></span>
        <div class="slider">
          <div class="track"></div><div class="fill" id="fill"></div>
          <input type="range" id="pmin" aria-label="Minimum price">
          <input type="range" id="pmax" aria-label="Maximum price">
        </div>
      </div>
      <div class="field rail-field">
        <span>Contains</span>
        <div class="chip-rail" id="tagRail" aria-label="Filter by ingredient"></div>
      </div>
      <div class="field rail-field">
        <span>Chefs</span>
        <div class="chip-rail" id="chipRail" aria-label="Filter by chef"></div>
      </div>
    </div>

    <div class="fbar">
      <span id="count" aria-live="polite" role="status"></span>
      <span id="fchips" style="display:contents"></span>
      <button class="clear-all" id="clear" hidden>Clear all</button>
    </div>
  </div>
</div>
<div class="dock-spacer" id="dockSpacer"></div>

<div class="app">
  <main id="main"></main>
  <span class="sr" id="copyStatus" role="status" aria-live="polite"></span>

  <footer class="note">
    Menu data is mirrored from menu.foosto.com and refreshes automatically through
    the morning. Availability can change between refreshes, so a dish may sell out
    before your order reaches the kitchen.
  </footer>
</div>

<button class="top-fab" id="topFab" aria-label="Back to top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-up"/></svg>
</button>

<script>
/* ===================================================================== */
// Where the Order button sends you. admin.foosto.com serves HTTP only, and
// this page is HTTPS on GitHub Pages -- fine here, because a top-level
// navigation is not mixed content the way a fetch() or an <img> would be.
const ORDER_URL    = 'http://admin.foosto.com/order/create/';
const MENU_FILE    = 'menu.js';
const LOAD_TIMEOUT = 15000;
const REFRESH_TZ   = 'Asia/Dhaka';               // menu times are Dhaka times, wherever you read this
// Foosto stocks roughly 4-14 portions per dish, so a "3 or fewer" warning
// would almost never fire. 5 flags genuinely scarce dishes. Tune to taste.
const LOW_STOCK    = 5;

/* Ingredient filter -------------------------------------------------------
   Dish names are free text typed by each kitchen, so this matches on spelling
   variants rather than an ingredient field that does not exist upstream:
   মুরগি/মুরগী, সরিষা/সরষে, and so on. Named species are listed for মাছ
   because plenty of dishes say "কৈ" or "শুঁটকি" without ever saying "মাছ".

   `strip` runs before `match`: চিংড়ি is its own filter, and every occurrence
   of it in this menu is literally spelled "চিংড়ি মাছ", so without stripping
   that phrase first a shrimp-only dish would answer to the fish filter too. */
const TAGS = [
  { id: 'goru',     label: '\u0997\u09B0\u09C1',
    match: '\u0997\u09B0\u09C1|\u0997\u09CB\u09B0\u09C1|\u09AC\u09BF\u09AB|beef' },
  { id: 'mach',     label: '\u09AE\u09BE\u099B',
    strip: '\u099A\u09BF\u0982\u09DC\u09BF\\s*(\u09AE\u09BE\u099B(\u09C7\u09B0|\u09B0)?)?',
    match: '\u09AE\u09BE\u099B|\u09B0\u09C1\u0987|\u0995\u09BE\u09A4\u09B2|\u0987\u09B2\u09BF\u09B6|\u09B6\u09BF\u0982|\u09AE\u09BE\u0997\u09C1\u09B0|\u0995\u0995\u09C8|\u09AA\u09BE\u0999\u09CD\u0997\u09BE|\u09A4\u09C7\u09B2\u09BE\u09AA\u09BF\u09DF\u09BE|\u09AA\u09BE\u09AC\u09A6\u09BE|\u099F\u09C7\u0982\u09B0\u09BE|\u099F\u09BE\u0995\u09BF|\u09AC\u09CB\u09DF\u09BE\u09B2|\u099A\u09BF\u09A4\u09B2|\u09AE\u09C3\u0997\u09C7\u09B2|\u09AA\u09C1\u0981\u099F\u09BF|\u0995\u09CB\u09B0\u09BE\u09B2|\u09B0\u09C2\u09AA\u099A\u09BE\u0981\u09A6\u09BE|\u09B2\u0987\u099F\u09CD\u099F\u09BE|\u09B6\u09C1\u0981\u099F\u0995\u09BF|\u09B6\u09C1\u099F\u0995\u09BF' },
  { id: 'murgi',    label: '\u09AE\u09C1\u09B0\u0997\u09BF',
    match: '\u09AE\u09C1\u09B0\u0997\u09BF|\u09AE\u09C1\u09B0\u0997\u09C0|\u09AE\u09CB\u09B0\u0997|\u099A\u09BF\u0995\u09C7\u09A8|chicken' },
  { id: 'dim',      label: '\u09A1\u09BF\u09AE',      match: '\u09A1\u09BF\u09AE' },
  { id: 'chingri',  label: '\u099A\u09BF\u0982\u09DC\u09BF',
    match: '\u099A\u09BF\u0982\u09DC\u09BF|\u099A\u09BF\u0982\u09DC\u09C0' },
  { id: 'shak',     label: '\u09B6\u09BE\u0995',      match: '\u09B6\u09BE\u0995' },
  { id: 'dal',      label: '\u09A1\u09BE\u09B2',      match: '\u09A1\u09BE\u09B2' },
  { id: 'polao',    label: '\u09AA\u09CB\u09B2\u09BE\u0993',
    match: '\u09AA\u09CB\u09B2\u09BE\u0993|\u09AA\u09CB\u09B2\u09BE\u0989|\u09AA\u09C1\u09B2\u09BE\u0993' },
  { id: 'shorisha', label: '\u09B8\u09B0\u09BF\u09B7\u09BE',
    match: '\u09B8\u09B0\u09BF\u09B7\u09BE|\u09B6\u09B0\u09BF\u09B7\u09BE|\u09B8\u09B0\u09B7\u09C7' },
];
const TAG_LABEL = new Map(TAGS.map((t) => [t.id, t.label]));

/* Kitchens type on different keyboards, and this menu proves it: চিংড়ি appears
   four times as U+09DC and four times as U+09A1 U+09BC (ড + nukta). They render
   identically and compare unequal, so a plain regex silently tagged half the
   shrimp dishes. NFC folds both to one form -- on both sides, patterns included,
   because the escapes above are only one of the two spellings themselves. */
const norm = (s) => s.normalize('NFC');
for (const t of TAGS) {
  t.re = new RegExp(norm(t.match), 'i');
  if (t.strip) t.stripRe = new RegExp(norm(t.strip), 'g');
}

// Computed once per item at load, not per keystroke: nine regexes across every
// dish on every render would be the slowest thing on the page.
function tagsOf(name) {
  const text = norm(name);
  const out = new Set();
  for (const t of TAGS) {
    if (t.re.test(t.stripRe ? text.replace(t.stripRe, ' ') : text)) out.add(t.id);
  }
  return out;
}
/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const main = $('main');
const taka = (n) => '\u09F3' + (Number.isInteger(n) ? n : n.toFixed(2));
const range = (a, b) => a === b ? taka(a) : taka(a) + '\u2013' + (Number.isInteger(b) ? b : b.toFixed(2));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const svg = (id) => '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#' + id + '"/></svg>';

/* --- Copying the menu code ----------------------------------------------
   The async Clipboard API is unavailable outside a secure context, and this
   page is explicitly meant to still work when opened from file:// while
   editing. So try it, then fall back to the old select-and-execCommand trick
   rather than leaving the button silently dead in exactly that case. */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);            // iOS needs the explicit range
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

/* Confirm on the chip itself. render() rebuilds these nodes wholesale, so a
   pending timer can outlive its button; clearing by id off the element keeps
   that harmless instead of resetting whatever chip took its place. */
function flashCopied(btn, ok) {
  if (!btn) return;
  clearTimeout(Number(btn.dataset.t) || 0);
  btn.classList.remove('copied', 'failed');
  btn.classList.add(ok ? 'copied' : 'failed');
  btn.querySelector('.ct-label').textContent = ok ? 'Copied' : 'Copy failed';
  btn.querySelector('use').setAttribute('href', ok ? '#ic-check' : '#ic-copy');
  $('copyStatus').textContent = ok
    ? 'Menu code ' + btn.dataset.code + ' copied'
    : 'Could not copy the menu code \u2014 select it and copy manually.';
  btn.dataset.t = setTimeout(() => {
    btn.classList.remove('copied', 'failed');
    btn.querySelector('.ct-label').textContent = 'Code';
    btn.querySelector('use').setAttribute('href', '#ic-copy');
  }, 1600);
}

/* --- Loading menu.js ---------------------------------------------------- */
/* Same-origin, assigns window.FOOSTO_MENU. A <script> tag rather than fetch()
   so the page also works from file:// while editing locally. The timestamp
   defeats caching, so every load gets whatever the Action last committed. */
function loadMenu() {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    const done = (fn, arg) => { clearTimeout(timer); s.remove(); fn(arg); };
    const timer = setTimeout(() => done(reject, new Error('timeout')), LOAD_TIMEOUT);
    s.src = MENU_FILE + '?t=' + Date.now();
    s.onload = () => window.FOOSTO_MENU && Array.isArray(window.FOOSTO_MENU.items)
      ? done(resolve, window.FOOSTO_MENU)
      : done(reject, new Error('menu.js loaded but contained no items'));
    s.onerror = () => done(reject, new Error('could not load ' + MENU_FILE));
    document.head.appendChild(s);
  });
}

/* --- State -------------------------------------------------------------- */
const state = { items: [], bounds: [0, 0], q: '', sort: 'price-asc',
                min: 0, max: 0, picked: new Set(), tags: new Set(), grouped: true };

/* Sorting answers two questions once dishes are grouped: how to order dishes
   inside a chef, and how to order the chefs. "Cheapest first" puts the chef
   who owns the cheapest dish on top, and that chef's cheapest dish first. */
const ITEM_SORT = {
  'price-asc':  (a, b) => a.price - b.price,
  'price-desc': (a, b) => b.price - a.price,
  'avail-desc': (a, b) => b.available - a.available,
  'chef-asc':   (a, b) => a.price - b.price,
};
const GROUP_SORT = {
  'price-asc':  (A, B) => A.min - B.min,
  'price-desc': (A, B) => B.max - A.max,
  'avail-desc': (A, B) => B.topAvail - A.topAvail,
  'chef-asc':   (A, B) => A.chef.localeCompare(B.chef),
};

/* Picking মুরগি and ডিম means "either", matching how the chef rail already
   behaves. Across groups it is AND: chef AND ingredient AND price. */
function filtered() {
  const q = state.q.trim().toLowerCase();
  const tags = [...state.tags];
  return state.items.filter((it) =>
    it.price >= state.min && it.price <= state.max &&
    (state.picked.size === 0 || state.picked.has(it.chef)) &&
    (tags.length === 0 || tags.some((t) => it.tags.has(t))) &&
    (q === '' || it.name.toLowerCase().includes(q)
              || it.chef.toLowerCase().includes(q)
              || it.code.toLowerCase().includes(q)));
}

function grouped(rows) {
  const map = new Map();
  for (const it of rows) {
    if (!map.has(it.chef)) map.set(it.chef, []);
    map.get(it.chef).push(it);
  }
  const groups = [...map].map(([chef, items]) => ({
    chef, items: items.sort(ITEM_SORT[state.sort]),
    min: Math.min(...items.map((i) => i.price)),
    max: Math.max(...items.map((i) => i.price)),
    topAvail: Math.max(...items.map((i) => i.available)),
  }));
  return groups.sort((A, B) => GROUP_SORT[state.sort](A, B) || A.chef.localeCompare(B.chef));
}

/* --- Rendering ---------------------------------------------------------- */
function dishHTML(it) {
  const out = it.available <= 0, low = !out && it.available <= LOW_STOCK;
  const tag = out ? '<span class="tag sold">Sold out</span>'
    : low ? '<span class="tag low">Only ' + it.available + ' left</span>'
          : '<span class="tag ok">' + it.available + ' left</span>';
  // Photos are hotlinked from Foosto over https. loading="lazy" means a long
  // list only pulls the ones actually on screen.
  const photo = it.images && it.images.length
    ? '<div class="thumb"><img src="' + esc(it.images[0]) + '" alt="" loading="lazy" '
      + 'decoding="async" onerror="this.parentNode.classList.add(\'none\');this.remove()"></div>'
    : '<div class="thumb none"></div>';
  // Price sits on its own line right under the name so it is never something
  // you have to hunt for in the middle of the grey meta row.
  return '<article class="item' + (out ? ' out' : '') + '">'
    + photo
    + '<div class="dish-info">'
    +   '<h3 class="name" lang="bn">' + esc(it.name) + '</h3>'
    +   '<div class="price-row">'
    +     '<span class="price">' + taka(it.price) + '</span>' + tag
    +   '</div>'
    +   '<div class="meta">'
    +     (state.grouped ? '' : '<span class="chef-tag">' + esc(it.chef) + '</span>')
    +     '<button class="code-tag" data-code="' + esc(it.code) + '"'
    +       ' aria-label="Copy menu code ' + esc(it.code) + '">'
    +       '<span class="ct-label">Code</span>' + esc(it.code) + svg('ic-copy')
    +     '</button>'
    +   '</div>'
    + '</div>'
    + (out
        ? '<button class="order" disabled>Sold out</button>'
        : '<a class="order" href="' + ORDER_URL + '" target="_blank" rel="noopener"'
          + ' data-code="' + esc(it.code) + '"'
          + ' aria-label="Order ' + esc(it.name.slice(0, 40)) + ' on Foosto, menu code '
          + esc(it.code) + '">Order</a>')
    + '</article>';
}

const fchip = (kind, val, label) =>
  '<span class="fchip"><span>' + esc(label) + '</span>'
  + '<button data-chip="' + kind + '" data-val="' + esc(val) + '" '
  + 'aria-label="Remove filter ' + esc(label) + '">\u00d7</button></span>';

function renderFilterChips() {
  const [lo, hi] = state.bounds;
  const bits = [];
  if (state.q.trim()) bits.push(fchip('search', '', 'Search: ' + state.q.trim()));
  for (const t of state.tags) bits.push(fchip('tag', t, TAG_LABEL.get(t)));
  for (const c of state.picked) bits.push(fchip('chef', c, c));
  if (state.min > lo || state.max < hi) bits.push(fchip('price', '', range(state.min, state.max)));
  $('fchips').innerHTML = bits.join('');
  return bits.length > 0;
}

function render() {
  const rows = filtered();
  const dirty = renderFilterChips();
  $('clear').hidden = !dirty;
  syncChips();

  const chefCount = new Set(rows.map((r) => r.chef)).size;
  $('count').textContent = rows.length
    ? rows.length + (rows.length === 1 ? ' dish' : ' dishes') + ' from '
      + chefCount + (chefCount === 1 ? ' chef' : ' chefs')
    : 'No matches';

  if (!rows.length) {
    main.innerHTML = '<div class="empty-state"><h3>No dishes match</h3>'
      + 'Try a different search, widen the price range, or drop the chef filter.'
      + '<br><button id="clearEmpty">Clear all filters</button></div>';
    $('clearEmpty').onclick = () => $('clear').click();
    return;
  }

  if (!state.grouped) {
    main.innerHTML = '<section class="tier">'
      + rows.sort(ITEM_SORT[state.sort]).map(dishHTML).join('') + '</section>';
    return;
  }

  main.innerHTML = grouped(rows).map((g) =>
    '<section class="tier" id="chef-' + slug(g.chef) + '">'
    + '<header class="ghead"><h2>' + esc(g.chef) + '</h2>'
    + '<span class="gmeta">' + g.items.length + (g.items.length === 1 ? ' dish \u00b7 ' : ' dishes \u00b7 ')
    + range(g.min, g.max) + '</span></header>'
    + g.items.map(dishHTML).join('') + '</section>').join('');
}
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* --- Filter controls ---------------------------------------------------- */
function syncSlider() {
  const [lo, hi] = state.bounds, span = Math.max(1, hi - lo);
  $('fill').style.left  = ((state.min - lo) / span * 100) + '%';
  $('fill').style.width = ((state.max - state.min) / span * 100) + '%';
  $('priceLabel').textContent = range(state.min, state.max);
}
function syncChips() {
  for (const b of $('chipRail').querySelectorAll('.chip')) {
    b.setAttribute('aria-pressed', String(state.picked.has(b.dataset.chef)));
  }
  for (const b of $('tagRail').querySelectorAll('.chip')) {
    b.setAttribute('aria-pressed', String(state.tags.has(b.dataset.tag)));
  }
}

function buildFilters() {
  const prices = state.items.map((i) => i.price);
  const lo = Math.floor(Math.min(...prices)), hi = Math.ceil(Math.max(...prices));
  state.bounds = [lo, hi]; state.min = lo; state.max = hi;
  state.picked.clear();
  state.tags.clear();

  for (const el of [$('pmin'), $('pmax')]) { el.min = lo; el.max = hi; el.step = 1; }
  $('pmin').value = lo; $('pmax').value = hi;
  syncSlider();

  for (const it of state.items) it.tags = tagsOf(it.name);
  // Fixed order, so the rail doesn't reshuffle under your thumb between
  // refreshes. Chips for ingredients nobody is cooking today render disabled.
  $('tagRail').innerHTML = TAGS.map((t) => {
    const n = state.items.reduce((sum, it) => sum + (it.tags.has(t.id) ? 1 : 0), 0);
    return '<button class="chip tag-chip" data-tag="' + t.id + '" aria-pressed="false"'
      + (n ? '' : ' disabled') + ' lang="bn">'
      + esc(t.label) + '<span class="n">' + n + '</span></button>';
  }).join('');

  const counts = new Map();
  for (const it of state.items) counts.set(it.chef, (counts.get(it.chef) || 0) + 1);
  // The rail is the chef multi-select: tap to add, tap again to remove.
  $('chipRail').innerHTML = [...counts.keys()].sort((a, b) => a.localeCompare(b)).map((c) =>
    '<button class="chip" data-chef="' + esc(c) + '" aria-pressed="false">'
    + esc(c) + '<span class="n">' + counts.get(c) + '</span></button>').join('');
}

/* --- Boot --------------------------------------------------------------- */
function showSkeleton() {
  main.innerHTML = '<div class="skel"><i></i><div><u></u><u></u></div></div>'.repeat(6);
  $('count').textContent = 'Loading today\u2019s menu\u2026';
}
function showError(msg) {
  main.innerHTML = '<div class="empty-state"><h3>Couldn\u2019t load the menu</h3>'
    + esc(msg) + '<br>Check your connection, then try again.'
    + '<br><button id="retry">Try again</button></div>';
  $('count').textContent = '';
  $('retry').onclick = boot;
}

async function boot() {
  showSkeleton();
  try {
    const data = await loadMenu();
    state.items = data.items;
    buildFilters();
    showFreshness(data);
    render();
  } catch (err) {
    showError(err.message);
  }
}

/* checkedAt is when the Action last looked; changedAt is when Foosto's dishes
   last actually differed. The label says "Last Refreshed", so it has to be the
   first one -- and now that every cron tick commits, this advances every half
   hour instead of freezing for a whole day whenever the kitchens repeat a menu.
   Swap to `data.changedAt || data.checkedAt` if you would rather it report the
   last genuine menu change, but then rename the label to match.
   Pinned to Dhaka and to 24h so it reads 20:49 for every visitor, rather than
   silently re-clocking itself to whatever timezone the browser happens to be
   in -- a Dhaka lunch menu labelled 9:49 AM would just be wrong. */
function showFreshness(data) {
  const t = new Date(data.checkedAt || data.changedAt);
  if (isNaN(t.getTime())) return;
  $('freshness').textContent = t.toLocaleTimeString('en-GB',
    { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: REFRESH_TZ });
  $('freshItem').hidden = false;
}

/* --- Events ------------------------------------------------------------- */
/* Narrowing a filter shortens the document under you. The browser clamps your
   scroll position to the new, shorter page, which lands you somewhere arbitrary
   -- frequently past the very dishes you just asked for, with the rest hidden
   behind the pinned bar. Snapping back to the top of the results makes the
   six dishes it promised you actually be the six dishes you see. */
function revealResults() {
  const bar = controls.classList.contains('docked') ? controls.offsetHeight : 0;
  const top = main.getBoundingClientRect().top + window.scrollY - bar - 8;
  if (window.scrollY > top) window.scrollTo(0, Math.max(0, top));
}

let debounce;
$('q').addEventListener('input', (e) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = e.target.value; render(); revealResults(); }, 120);
});
$('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); revealResults(); });
$('pmin').addEventListener('input', (e) => {
  state.min = Math.min(+e.target.value, state.max); e.target.value = state.min; syncSlider(); render(); revealResults();
});
$('pmax').addEventListener('input', (e) => {
  state.max = Math.max(+e.target.value, state.min); e.target.value = state.max; syncSlider(); render(); revealResults();
});
$('groupBtn').addEventListener('click', (e) => {
  state.grouped = !state.grouped;
  e.target.setAttribute('aria-pressed', String(state.grouped));
  e.target.textContent = state.grouped ? 'Grouped by chef' : 'One flat list';
  render(); revealResults();
});
$('toggleFilters').addEventListener('click', (e) => {
  const open = $('panel').hidden;
  $('panel').hidden = !open;
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
$('chipRail').addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  const chef = b.dataset.chef;
  state.picked.has(chef) ? state.picked.delete(chef) : state.picked.add(chef);
  render(); revealResults();
});
$('tagRail').addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  const tag = b.dataset.tag;
  state.tags.has(tag) ? state.tags.delete(tag) : state.tags.add(tag);
  render(); revealResults();
});
$('fchips').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-chip]');
  if (!b) return;
  if (b.dataset.chip === 'search') { state.q = ''; $('q').value = ''; }
  if (b.dataset.chip === 'chef') state.picked.delete(b.dataset.val);
  if (b.dataset.chip === 'tag') state.tags.delete(b.dataset.val);
  if (b.dataset.chip === 'price') {
    [state.min, state.max] = state.bounds;
    $('pmin').value = state.min; $('pmax').value = state.max; syncSlider();
  }
  render(); revealResults();
});
$('clear').addEventListener('click', () => {
  state.q = ''; $('q').value = '';
  state.picked.clear();
  state.tags.clear();
  [state.min, state.max] = state.bounds;
  $('pmin').value = state.min; $('pmax').value = state.max;
  syncSlider(); render(); revealResults();
});

// A horizontal rail under a vertical page traps the wheel: without this the
// page scrolls away instead of moving the chef list. Only hijack the wheel
// when the rail actually has somewhere left to go, so the page still scrolls
// once you reach either end.
$('chipRail').addEventListener('wheel', (e) => {
  const el = e.currentTarget;
  const max = el.scrollWidth - el.clientWidth;
  if (max <= 0) return;
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (delta === 0) return;
  if ((delta < 0 && el.scrollLeft === 0) || (delta > 0 && el.scrollLeft >= max - 1)) return;
  e.preventDefault();
  el.scrollLeft += delta;
}, { passive: false });

main.addEventListener('click', (e) => {
  const chip = e.target.closest('.code-tag');
  if (chip) { copyText(chip.dataset.code).then((ok) => flashCopied(chip, ok)); return; }

  // Leaving for Foosto's form, which opens with an empty menu-code field, so
  // put the code on the clipboard on the way out and confirm on that dish's
  // own chip. Best effort only: a browser may refuse the write once the new
  // tab takes focus, and the chip is still there to tap if it does.
  const link = e.target.closest('a.order');
  if (link) {
    const own = link.closest('.item').querySelector('.code-tag');
    copyText(link.dataset.code).then((ok) => { if (ok) flashCopied(own, true); });
  }
});

$('topFab').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* --- Docking the controls ----------------------------------------------
   The masthead scrolls away; only this block follows you down, and it
   compacts itself when it does. It is a single DOM node that switches to
   position:fixed rather than a second copy of the search box, so focus, the
   typed query and the open/closed panel all survive the transition. The
   spacer takes over its height so the list doesn't jump up underneath it. */
const controls = $('controls'), spacer = $('dockSpacer');
let dockAt = 0;

function measureDock() {
  if (controls.classList.contains('docked')) return;   // origin is only valid at rest
  dockAt = controls.getBoundingClientRect().top + window.scrollY;
}
function updateDock() {
  const should = window.scrollY > dockAt;
  if (should === controls.classList.contains('docked')) return;
  controls.classList.toggle('docked', should);
  spacer.style.height = should ? controls.offsetHeight + 'px' : '0px';
  document.documentElement.style.setProperty('--barH',
    (should ? controls.offsetHeight : 0) + 'px');
}
function onScroll() {
  updateDock();
  $('topFab').classList.toggle('show', window.scrollY > 400);
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', () => { measureDock(); updateDock(); });
// The panel opening or chips wrapping changes the docked height.
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    if (controls.classList.contains('docked')) {
      spacer.style.height = controls.offsetHeight + 'px';
      document.documentElement.style.setProperty('--barH', controls.offsetHeight + 'px');
    } else {
      measureDock();
    }
  }).observe(controls);
}
measureDock();

boot();
</script>
</body>
</html>
