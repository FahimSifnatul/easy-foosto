<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foosto lunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9; --raised:#FFFFFF; --ink:#14171A; --ink-soft:#5B6470;
  --rule:#E4E6E2; --accent:#B4341F; --accent-ink:#FFFFFF; --low:#8A6D0B;
  --focus:#1D4ED8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --bengali:"Noto Serif Bengali","Nirmala UI","Shonar Bangla",serif;
  --gap:clamp(16px,4vw,32px);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#131416;--raised:#1B1D20;--ink:#ECEDEE;--ink-soft:#9BA3AC;
        --rule:#2C2F33;--accent:#E4674E;--accent-ink:#17181A;--low:#D2A93A;--focus:#7CA0FF;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:940px;margin:0 auto;padding:0 var(--gap)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- Hero. The cutoff clock is the one loud element on the page. -------- */
.hero{padding:40px 0 28px}
.hero h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--ink-soft)}
.clock{margin:10px 0 0;font-size:clamp(30px,7vw,46px);line-height:1.05;font-weight:600;
       letter-spacing:-.02em;font-feature-settings:"tnum"}
.clock.closed{color:var(--ink-soft)}
.clock em{font-style:normal;color:var(--accent)}
.hero p{margin:8px 0 0;color:var(--ink-soft);font-size:14px;max-width:62ch}

/* ---- Sticky controls --------------------------------------------------- */
.bar{position:sticky;top:0;z-index:30;background:var(--paper);
     border-bottom:1px solid var(--rule)}
@supports (backdrop-filter:blur(6px)){
  .bar{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px)}
}
.bar-inner{padding:12px 0}
.row1{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--raised);
        border:1px solid var(--rule);border-radius:8px;padding:0 10px;height:42px}
.search input{flex:1;min-width:0;border:0;background:none;height:100%;font:inherit;color:inherit;outline:none}
.search svg{flex:none;color:var(--ink-soft)}
.toggle{flex:none;height:42px;padding:0 14px;background:var(--raised);border:1px solid var(--rule);
        border-radius:8px;font-size:14px;font-weight:500}
.toggle[aria-expanded=true]{border-color:var(--ink);}
@media(min-width:721px){.toggle{display:none}}

.panel{display:grid;gap:14px;padding-top:12px}
/* see .panel[hidden] below */
.panel[hidden]{display:none}
@media(min-width:721px){
  .panel,.panel[hidden]{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end}
}
.field{min-width:0}
.field > span{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
select{width:100%;height:38px;background:var(--raised);color:inherit;border:1px solid var(--rule);
       border-radius:8px;padding:0 8px;font:inherit;font-size:14px}

/* dual-handle price slider */
.slider{position:relative;height:38px;display:flex;align-items:center}
.slider .track{position:absolute;left:0;right:0;height:3px;background:var(--rule);border-radius:2px}
.slider .fill{position:absolute;height:3px;background:var(--accent);border-radius:2px}
.slider input{position:absolute;left:0;width:100%;margin:0;background:none;pointer-events:none;
              -webkit-appearance:none;appearance:none;height:38px}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;
  border-radius:50%;background:var(--raised);border:2px solid var(--accent);cursor:grab}
.slider input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;
  background:var(--raised);border:2px solid var(--accent);cursor:grab}
.slider input::-moz-range-track{background:none}

/* chef multi-select */
.multi{position:relative}
.multi > button{width:100%;height:38px;text-align:left;background:var(--raised);
  border:1px solid var(--rule);border-radius:8px;padding:0 10px;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;max-height:270px;overflow:auto;
  background:var(--raised);border:1px solid var(--rule);border-radius:8px;padding:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu label{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:6px;font-size:14px;cursor:pointer}
.menu label:hover{background:var(--paper)}
.menu input{accent-color:var(--accent);flex:none}
.menu .cnt{margin-left:auto;color:var(--ink-soft);font-size:12.5px}

.status{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:10px 0 0;
        font-size:13.5px;color:var(--ink-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13.5px;
         font-weight:500;text-decoration:underline;text-underline-offset:3px}
.linkbtn[hidden]{display:none}

/* ---- Menu ledger ------------------------------------------------------- */
main{padding:8px 0 72px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:6px 18px;align-items:start;
  padding:18px 0;border-bottom:1px solid var(--rule);
  content-visibility:auto;contain-intrinsic-size:0 104px}
.name{grid-column:1;font-family:var(--bengali);font-size:16.5px;line-height:1.55;font-weight:500;margin:0}
.meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-soft);margin-top:3px}
.meta b{font-weight:500;color:var(--ink)}
.price{grid-column:2;grid-row:1/span 2;font-size:17px;font-weight:600;white-space:nowrap;padding-top:1px}
.order{grid-column:3;grid-row:1/span 2;height:38px;padding:0 18px;border:0;border-radius:8px;
  background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:14px;white-space:nowrap}
.order:hover{filter:brightness(1.08)}
.order:disabled{background:none;color:var(--ink-soft);border:1px solid var(--rule);cursor:not-allowed;filter:none}
.item.out .name,.item.out .price{opacity:.5}
.tag{font-weight:500}
.tag.sold{color:var(--accent)}
.tag.low{color:var(--low)}

@media(max-width:560px){
  .item{grid-template-columns:1fr auto}
  .price{grid-column:2;grid-row:1}
  .order{grid-column:1/-1;grid-row:3;justify-self:stretch;margin-top:10px}
}
.skel{padding:18px 0;border-bottom:1px solid var(--rule)}
.skel div{height:12px;border-radius:4px;background:var(--rule);opacity:.7}
.skel div:first-child{width:min(70%,420px)}
.skel div:last-child{width:120px;margin-top:10px;height:10px}
@media(prefers-reduced-motion:no-preference){
  .skel div{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
}
.notice{padding:52px 4px;text-align:center;color:var(--ink-soft);font-size:14.5px}
.notice strong{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px}
.notice button{margin-top:16px;height:40px;padding:0 20px;border-radius:8px;border:0;
  background:var(--accent);color:var(--accent-ink);font-weight:500}

/* ---- Modal ------------------------------------------------------------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,11,12,.5);display:flex;
  align-items:flex-end;justify-content:center;padding:0}
@media(min-width:600px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--paper);width:100%;max-width:460px;max-height:92vh;overflow:auto;
  border-radius:14px 14px 0 0;padding:22px}
@media(min-width:600px){.modal{border-radius:14px}}
@media(prefers-reduced-motion:no-preference){.modal{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(14px);opacity:0}}}
.modal h2{margin:0 0 2px;font-size:19px;font-weight:600}
.modal .dish{font-family:var(--bengali);font-size:14.5px;color:var(--ink-soft);
  line-height:1.5;margin:0 0 18px}
.f{margin-bottom:13px}
.f label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;background:var(--raised);color:inherit;border:1px solid var(--rule);
  border-radius:8px;padding:9px 10px;font:inherit;font-size:15px}
.f textarea{resize:vertical;min-height:64px}
.f input:read-only{background:var(--rule);color:var(--ink-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.submit{width:100%;height:46px;border:0;border-radius:9px;background:var(--accent);
  color:var(--accent-ink);font-weight:600;font-size:15px;margin-top:6px}
.submit:disabled{opacity:.6;cursor:wait}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.result{margin-top:14px;padding:12px 13px;border-radius:9px;font-size:14px;line-height:1.5;border:1px solid}
.result.ok{border-color:var(--rule);background:var(--raised)}
.result.bad{border-color:var(--accent);color:var(--accent)}
.result.info{border-color:var(--rule);background:var(--raised);color:var(--ink-soft)}
.result a{color:var(--accent)}
</style>
</head>
<body>

<!-- ========================================================================
     ORDER SUBMISSION CONFIG  —  READ THIS BEFORE DEPLOYING
     ========================================================================
     admin.foosto.com has NO HTTPS (port 443 refuses connections). GitHub Pages
     serves over HTTPS. A browser will therefore block any POST from this page
     straight to http://admin.foosto.com as mixed content. There is no
     client-side workaround; `mode:'no-cors'` does not help, because mixed
     content is blocked before CORS is even evaluated.

     Set ORDER.endpoint to an HTTPS proxy that forwards to Foosto and in-app
     ordering starts working. Leave it empty and the modal degrades honestly:
     it collects the details, saves them, and hands off to Foosto's own form.

     ORDER.fields maps this app's inputs to Foosto's form input names. The
     names below are PLACEHOLDERS — I could not read the form's markup. Open
     http://admin.foosto.com/order/create/, submit it once with DevTools'
     Network tab open, and copy the real payload keys in here.
     ==================================================================== -->

<header class="hero wrap">
  <h1>Foosto home-kitchen lunch, Dhaka</h1>
  <p class="clock" id="clock">&nbsp;</p>
  <p id="heroNote">Gulshan, Banani, Tejgaon, Mohakhali and Badda.</p>
</header>

<div class="bar">
  <div class="wrap bar-inner">
    <div class="row1">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search dishes or chefs" autocomplete="off" aria-label="Search dishes or chefs">
      </div>
      <button class="toggle" id="toggleFilters" aria-expanded="false" aria-controls="panel">Filters</button>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="field">
        <span id="lblSort">Sort</span>
        <select id="sort" aria-labelledby="lblSort">
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
          <option value="avail-desc">Most available</option>
        </select>
      </div>
      <div class="field">
        <span>Price <span id="priceLabel"></span></span>
        <div class="slider" id="slider">
          <div class="track"></div><div class="fill" id="fill"></div>
          <input type="range" id="pmin" aria-label="Minimum price">
          <input type="range" id="pmax" aria-label="Maximum price">
        </div>
      </div>
      <div class="field multi" id="multi">
        <span id="lblChef">Chef</span>
        <button type="button" id="chefBtn" aria-expanded="false" aria-labelledby="lblChef chefBtn">All chefs</button>
        <div class="menu" id="chefMenu" hidden></div>
      </div>
    </div>

    <div class="status">
      <span id="count" aria-live="polite" role="status"></span>
      <button class="linkbtn" id="clear" hidden>Clear all filters</button>
      <span style="margin-left:auto" id="freshness"></span>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>

<script>
/* ===================================================================== */
const ORDER = {
  endpoint: '',                                    // e.g. 'https://foosto-order.you.workers.dev/order'
  encoding: 'form',                                // 'form' (urlencoded) or 'json'
  fallbackUrl: 'http://admin.foosto.com/order/create/',
  fields: {                                        // our key  ->  Foosto's input name
    menuCode: 'menu_code',
    quantity: 'quantity',
    name:     'customer_name',
    phone:    'phone',
    whatsapp: 'whatsapp_phone',
    email:    'email',
    address:  'address',
  },
};
const MENU_FILE   = 'menu.js';
const LOAD_TIMEOUT = 15000;
const CUTOFF       = { hour: 10, minute: 20 };   // Dhaka local; UTC+6, no DST
const STORE_KEY    = 'foosto.customer.v1';
// Foosto stocks roughly 4-14 portions per dish, so a "3 or fewer" warning
// would almost never fire. 5 flags genuinely scarce dishes. Tune to taste.
const LOW_STOCK    = 5;
/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const main = $('main');
const taka = (n) => '\u09F3' + (Number.isInteger(n) ? n : n.toFixed(2));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* --- localStorage, wrapped so private browsing can't break the app ------ */
const store = {
  read() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || null; } catch { return null; } },
  write(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; } catch { return false; } },
  clear() { try { localStorage.removeItem(STORE_KEY); } catch {} },
};

/* --- Cutoff clock ------------------------------------------------------- */
function tickClock() {
  const DHAKA = 6 * 3600e3;                       // UTC+6, no daylight saving
  const now = Date.now();
  const d = new Date(now + DHAKA);
  const cutoff = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(),
                          CUTOFF.hour, CUTOFF.minute) - DHAKA;
  const left = cutoff - now;
  const el = $('clock');
  if (left <= 0) {
    el.className = 'clock closed';
    el.textContent = 'Today\u2019s ordering has closed';
    $('heroNote').textContent = 'The menu below is today\u2019s. Ordering reopens tomorrow morning.';
    return;
  }
  const h = Math.floor(left / 3600e3), m = Math.floor(left / 60e3) % 60, s = Math.floor(left / 1e3) % 60;
  el.className = 'clock';
  el.innerHTML = (h ? h + 'h ' : '') + m + 'm ' + String(s).padStart(2, '0') + 's <em>left to order</em>';
}

/* --- Loading menu.js ---------------------------------------------------- */
/* menu.js is same-origin and assigns window.FOOSTO_MENU. A <script> tag is
   used rather than fetch() so the page also works from file:// while you're
   editing it locally. The timestamp defeats any CDN or browser caching, so
   every page load gets whatever the Action last committed. */
function loadMenu() {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    const done = (fn, arg) => { clearTimeout(timer); s.remove(); fn(arg); };
    const timer = setTimeout(() => done(reject, new Error('timeout')), LOAD_TIMEOUT);
    s.src = MENU_FILE + '?t=' + Date.now();
    s.onload = () => window.FOOSTO_MENU && Array.isArray(window.FOOSTO_MENU.items)
      ? done(resolve, window.FOOSTO_MENU)
      : done(reject, new Error('menu.js loaded but contained no items'));
    s.onerror = () => done(reject, new Error('could not load ' + MENU_FILE));
    document.head.appendChild(s);
  });
}

/* --- State -------------------------------------------------------------- */
const state = { items: [], chefs: [], bounds: [0, 0], q: '', sort: 'price-asc',
                min: 0, max: 0, picked: new Set() };

function pipeline() {
  const q = state.q.trim().toLowerCase();
  let out = state.items.filter((it) =>
    it.price >= state.min && it.price <= state.max &&
    (state.picked.size === 0 || state.picked.has(it.chef)) &&
    (q === '' || it.name.toLowerCase().includes(q) || it.chef.toLowerCase().includes(q)));

  const by = { 'price-asc': (a, b) => a.price - b.price,
               'price-desc': (a, b) => b.price - a.price,
               'avail-desc': (a, b) => b.available - a.available };
  return out.sort((a, b) => by[state.sort](a, b) || a.name.localeCompare(b.name, 'bn'));
}

function render() {
  const rows = pipeline();
  const [lo, hi] = state.bounds;
  const dirty = state.q !== '' || state.picked.size > 0 || state.min > lo || state.max < hi;

  $('count').textContent = rows.length + (rows.length === 1 ? ' dish' : ' dishes')
    + (dirty ? ' of ' + state.items.length : '');
  $('clear').hidden = !dirty;

  if (!rows.length) {
    main.innerHTML = '<div class="notice"><strong>No dishes match</strong>'
      + 'Try a different search, or widen the price range.</div>';
    return;
  }
  main.innerHTML = rows.map((it) => {
    const out = it.available <= 0, low = !out && it.available <= LOW_STOCK;
    const tag = out ? '<span class="tag sold">Sold out</span>'
      : low ? '<span class="tag low">Only ' + it.available + ' left</span>'
            : it.available + ' left';
    return '<article class="item' + (out ? ' out' : '') + '">'
      + '<h2 class="name" lang="bn">' + esc(it.name) + '</h2>'
      + '<p class="meta"><b>' + esc(it.chef) + '</b><span>' + tag + '</span>'
      + '<span>#' + esc(it.code) + '</span></p>'
      + '<div class="price">' + taka(it.price) + '</div>'
      + '<button class="order" data-code="' + esc(it.code) + '"' + (out ? ' disabled' : '')
      + ' aria-label="Order ' + esc(it.name.slice(0, 40)) + '">'
      + (out ? 'Sold out' : 'Order') + '</button></article>';
  }).join('');
}

/* --- Filter controls ---------------------------------------------------- */
function syncSlider() {
  const [lo, hi] = state.bounds, span = Math.max(1, hi - lo);
  $('fill').style.left  = ((state.min - lo) / span * 100) + '%';
  $('fill').style.width = ((state.max - state.min) / span * 100) + '%';
  $('priceLabel').textContent = taka(state.min) + '\u2013' + taka(state.max);
}

function buildFilters() {
  const prices = state.items.map((i) => i.price);
  const lo = Math.floor(Math.min(...prices)), hi = Math.ceil(Math.max(...prices));
  state.bounds = [lo, hi]; state.min = lo; state.max = hi;
  state.picked.clear();

  for (const el of [$('pmin'), $('pmax')]) { el.min = lo; el.max = hi; el.step = 1; }
  $('pmin').value = lo; $('pmax').value = hi;
  syncSlider();

  const counts = new Map();
  for (const it of state.items) counts.set(it.chef, (counts.get(it.chef) || 0) + 1);
  state.chefs = [...counts.keys()].sort((a, b) => a.localeCompare(b));
  $('chefMenu').innerHTML = state.chefs.map((c) =>
    '<label><input type="checkbox" value="' + esc(c) + '">' + esc(c)
    + '<span class="cnt">' + counts.get(c) + '</span></label>').join('');
}

function chefLabel() {
  const n = state.picked.size;
  $('chefBtn').textContent = n === 0 ? 'All chefs'
    : n === 1 ? [...state.picked][0] : n + ' chefs selected';
}

/* --- Order modal -------------------------------------------------------- */
let lastFocused = null;

function openModal(item) {
  lastFocused = document.activeElement;
  const saved = store.read() || {};
  const qtyMax = Math.min(50, Math.max(1, item.available));
  const configured = Boolean(ORDER.endpoint);

  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">'
    + '<h2 id="mTitle">Order this dish</h2>'
    + '<p class="dish" lang="bn">' + esc(item.name) + ' \u00b7 ' + esc(item.chef) + '</p>'
    + '<div class="two">'
    +   '<div class="f"><label for="mCode">Menu code</label>'
    +     '<input id="mCode" value="' + esc(item.code) + '" readonly></div>'
    +   '<div class="f"><label for="mQty">Quantity</label><select id="mQty">'
    +     Array.from({ length: qtyMax }, (_, i) => '<option>' + (i + 1) + '</option>').join('')
    +   '</select></div>'
    + '</div>'
    + '<div class="f"><label for="mName">Your name</label>'
    +   '<input id="mName" autocomplete="name" value="' + esc(saved.name || '') + '"></div>'
    + '<div class="two">'
    +   '<div class="f"><label for="mPhone">Phone</label>'
    +     '<input id="mPhone" type="tel" inputmode="tel" autocomplete="tel" value="' + esc(saved.phone || '') + '"></div>'
    +   '<div class="f"><label for="mWa">WhatsApp</label>'
    +     '<input id="mWa" type="tel" inputmode="tel" value="' + esc(saved.whatsapp || '') + '"></div>'
    + '</div>'
    + '<div class="f"><label for="mEmail">Email</label>'
    +   '<input id="mEmail" type="email" autocomplete="email" value="' + esc(saved.email || '') + '"></div>'
    + '<div class="f"><label for="mAddr">Delivery address</label>'
    +   '<textarea id="mAddr" autocomplete="street-address">' + esc(saved.address || '') + '</textarea></div>'
    + '<button class="submit" id="mGo">' + (configured ? 'Place order' : 'Continue on Foosto') + '</button>'
    + '<div class="modal-foot">'
    +   '<button class="linkbtn" id="mCancel">Cancel</button>'
    +   '<button class="linkbtn" id="mForget"' + (Object.keys(saved).length ? '' : ' hidden') + '>Clear saved details</button>'
    + '</div>'
    + '<div id="mResult" aria-live="polite"></div></div>';

  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  $('mName').focus();

  const close = () => {
    scrim.remove();
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
  };
  const values = () => ({
    menuCode: item.code,
    quantity: $('mQty').value,
    name: $('mName').value.trim(),
    phone: $('mPhone').value.trim(),
    whatsapp: $('mWa').value.trim(),
    email: $('mEmail').value.trim(),
    address: $('mAddr').value.trim(),
  });
  const say = (cls, html) => { $('mResult').className = 'result ' + cls; $('mResult').innerHTML = html; };

  scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });
  $('mCancel').onclick = close;
  scrim.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
    if (e.key !== 'Tab') return;
    const f = scrim.querySelectorAll('button:not([hidden]),input,select,textarea');           // simple focus trap
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  $('mForget').onclick = () => {
    store.clear();
    for (const id of ['mName', 'mPhone', 'mWa', 'mEmail', 'mAddr']) $(id).value = '';
    $('mForget').hidden = true;
    say('info', 'Saved details cleared from this browser.');
  };

  $('mGo').onclick = async () => {
    const v = values();
    if (!v.name || !v.phone || !v.address) {
      return say('bad', 'Name, phone and address are all required.');
    }
    // Persist customer details only. Never the menu code or quantity.
    const { menuCode, quantity, ...customer } = v;
    if (!store.write(customer)) {
      say('info', 'Order details kept for this visit only \u2014 this browser is blocking storage.');
    }
    $('mForget').hidden = false;

    if (!ORDER.endpoint) {
      say('info', 'This app can\u2019t submit to Foosto directly yet, because their order server '
        + 'has no HTTPS. Your details are saved for next time. '
        + '<a href="' + ORDER.fallbackUrl + '" target="_blank" rel="noopener">Open Foosto\u2019s order form</a> '
        + 'and enter menu code <b>' + esc(item.code) + '</b>.');
      return;
    }

    const btn = $('mGo');
    btn.disabled = true; btn.textContent = 'Placing order\u2026';
    say('info', '');
    try {
      const f = ORDER.fields;
      const body = { [f.menuCode]: v.menuCode, [f.quantity]: v.quantity, [f.name]: v.name,
                     [f.phone]: v.phone, [f.whatsapp]: v.whatsapp, [f.email]: v.email,
                     [f.address]: v.address };
      const res = await fetch(ORDER.endpoint, {
        method: 'POST',
        headers: { 'content-type': ORDER.encoding === 'json'
          ? 'application/json' : 'application/x-www-form-urlencoded' },
        body: ORDER.encoding === 'json'
          ? JSON.stringify(body) : new URLSearchParams(body).toString(),
      });
      if (!res.ok) throw new Error('The order server replied with HTTP ' + res.status + '.');
      say('ok', '<b>Order placed.</b> Menu code ' + esc(item.code) + ', quantity ' + esc(v.quantity)
        + '. Foosto will confirm on ' + esc(v.phone) + '.');
      btn.textContent = 'Order placed';
    } catch (err) {
      // Modal stays open and every field keeps its value, so nothing is retyped.
      say('bad', esc(err.message) + ' Your details are still here \u2014 try again.');
      btn.disabled = false; btn.textContent = 'Place order';
    }
  };
}

/* --- Boot --------------------------------------------------------------- */
function showSkeleton() {
  main.innerHTML = '<div class="skel"><div></div><div></div></div>'.repeat(6);
  $('count').textContent = 'Loading today\u2019s menu\u2026';
}
function showError(msg) {
  main.innerHTML = '<div class="notice"><strong>Couldn\u2019t load the menu</strong>'
    + esc(msg) + '<br>Check your connection, then try again.'
    + '<br><button id="retry">Try again</button></div>';
  $('count').textContent = '';
  $('retry').onclick = boot;
}

async function boot() {
  showSkeleton();
  try {
    const data = await loadMenu();
    state.items = data.items;
    buildFilters();
    chefLabel();
    const when = new Date(data.changedAt || data.checkedAt);
    $('freshness').textContent = 'Menu updated ' + when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    render();
  } catch (err) {
    showError(err.message);
  }
}

/* Events */
let debounce;
$('q').addEventListener('input', (e) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = e.target.value; render(); }, 120);
});
$('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
$('pmin').addEventListener('input', (e) => {
  state.min = Math.min(+e.target.value, state.max); e.target.value = state.min; syncSlider(); render();
});
$('pmax').addEventListener('input', (e) => {
  state.max = Math.max(+e.target.value, state.min); e.target.value = state.max; syncSlider(); render();
});
$('chefBtn').addEventListener('click', () => {
  const open = $('chefMenu').hidden;
  $('chefMenu').hidden = !open;
  $('chefBtn').setAttribute('aria-expanded', String(open));
});
$('chefMenu').addEventListener('change', (e) => {
  e.target.checked ? state.picked.add(e.target.value) : state.picked.delete(e.target.value);
  chefLabel(); render();
});
document.addEventListener('click', (e) => {
  if (!$('multi').contains(e.target)) { $('chefMenu').hidden = true; $('chefBtn').setAttribute('aria-expanded', 'false'); }
});
$('toggleFilters').addEventListener('click', (e) => {
  const open = $('panel').hidden;
  $('panel').hidden = !open;
  e.target.setAttribute('aria-expanded', String(open));
});
$('clear').addEventListener('click', () => {
  state.q = ''; $('q').value = '';
  state.picked.clear();
  $('chefMenu').querySelectorAll('input').forEach((i) => { i.checked = false; });
  chefLabel();
  [state.min, state.max] = state.bounds;
  $('pmin').value = state.min; $('pmax').value = state.max;
  syncSlider(); render();
});
main.addEventListener('click', (e) => {
  const btn = e.target.closest('.order');
  if (!btn || btn.disabled) return;
  const item = state.items.find((i) => i.code === btn.dataset.code);
  if (item) openModal(item);
});

tickClock(); setInterval(tickClock, 1000);
boot();
</script>
</body>
