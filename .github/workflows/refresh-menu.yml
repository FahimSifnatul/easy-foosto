name: Refresh menu

on:
  schedule:
    # Foosto's lunch cutoff is 10:20 AM Dhaka time. Dhaka is UTC+6 year-round
    # (no daylight saving), so the ordering window is roughly 00:00-05:00 UTC.
    #
    # GitHub's floor is one run every 5 minutes. A "* * * * *" cron commits
    # cleanly but simply will not run every minute, so don't write one.
    # Runs are also queued and can be delayed at busy times, which is why these
    # start at :02 and :17 rather than on the hour.
    - cron: '*/30 * * * *'
  workflow_dispatch:              # manual "Run workflow" button

permissions:
  contents: write

# If a run is still going when the next one fires, let the newer one wait
# rather than racing it to the same commit.
concurrency:
  group: refresh-menu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No npm install. The scraper is dependency-free on purpose: it keeps
      # each run to a few seconds and removes a whole class of supply-chain
      # and lockfile breakage from a job that runs ~100x a day.
      - name: Scrape menu
        id: scrape
        run: node scripts/scrape-menu.mjs menu.js

      - name: Commit if the menu changed
        if: steps.scrape.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # menu.js is regenerated in full every run, so there is never anything
          # to merge: we just need the new file to land on the current branch tip.
          #
          # A plain `git push` breaks in two situations that both happen here:
          #   1. Re-running an OLD run. actions/checkout restores that run's
          #      original commit, so the branch is behind and can never
          #      fast-forward. This is the "fetch first" rejection.
          #   2. Two runs overlapping, where the other one pushes first.
          # Re-anchoring to origin before each attempt handles both.
          for attempt in 1 2 3; do
            cp menu.js "$RUNNER_TEMP/menu.js"
            # Explicit refspec: actions/checkout does not always leave a
            # remote-tracking ref we can reset onto, so write one ourselves.
            git fetch --depth=1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/menu.js" menu.js
            git add menu.js

            if git diff --cached --quiet; then
              echo "Branch already has this exact menu. Nothing to commit."
              exit 0
            fi

            git commit -m "Menu refresh $(date -u +'%Y-%m-%d %H:%MZ')"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt; another run got there first. Retrying."
            sleep $(( attempt * 5 ))
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
