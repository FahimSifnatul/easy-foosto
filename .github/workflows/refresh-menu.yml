name: Refresh menu

on:
  schedule:
    # Foosto's lunch cutoff is 10:20 AM Dhaka time. Dhaka is UTC+6 year-round
    # (no daylight saving), so the ordering window is roughly 00:00-05:00 UTC.
    #
    # GitHub's floor is one run every 5 minutes. A "* * * * *" cron commits
    # cleanly but simply will not run every minute, so don't write one.
    # Runs are also queued and can be delayed at busy times, which is why these
    # start at :02 and :17 rather than on the hour.
    - cron: '2-59/5 0-4 * * *'   # every 5 min, 06:00-11:00 Dhaka
    - cron: '17 5-23 * * *'      # hourly the rest of the day
  workflow_dispatch:              # manual "Run workflow" button

permissions:
  contents: write

# If a run is still going when the next one fires, let the newer one wait
# rather than racing it to the same commit.
concurrency:
  group: refresh-menu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No npm install. The scraper is dependency-free on purpose: it keeps
      # each run to a few seconds and removes a whole class of supply-chain
      # and lockfile breakage from a job that runs ~100x a day.
      - name: Scrape menu
        id: scrape
        run: node scripts/scrape-menu.mjs menu.js

      - name: Commit if the menu changed
        if: steps.scrape.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.js
          git commit -m "Menu refresh $(date -u +'%Y-%m-%d %H:%MZ')"
          # A run can overlap a push from the previous one; rebase rather than fail.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
