name: Scrape Foosto menu

on:
  schedule:
    # 03:35 UTC = 9:35 AM in Dhaka (UTC+6) — well before the 10:20 AM
    # order cutoff, so the site is showing today's menu by the time
    # anyone checks it in the morning.
    - cron: '35 3 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scraper
        run: python3 scripts/scrape_menu.py

      - name: Commit updated menu data (only if it actually changed)
        run: |
          git config user.name "foosto-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add menu-data.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update menu data ($(date -u +%Y-%m-%d))"
          git push
